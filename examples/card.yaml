type: custom:healthsync-dashboard-card
title: Gezondheid
language: nl
days: 7
step_goal: 10000
calorie_goal: 600
show_activity: true
show_sleep: true
show_heart_rate: true
show_workouts_tab: true

# Optionele eigen volgorde van de tegels:
# tile_order:
#   - heart_rate
#   - blood_oxygen
#   - steps
#   - active_calories

# Optioneel: apparaat voor exacte meetpunten in de hartslaggrafiek
# (te kiezen via de grafische editor; zonder deze instelling probeert de
# kaart het apparaat automatisch te bepalen).
# device_id: 0123456789abcdef0123456789abcdef

# De entiteiten van een standaardinstallatie van HealthSync worden automatisch
# gevonden. Zijn ze hernoemd, dan kun je ze hier handmatig opgeven:
